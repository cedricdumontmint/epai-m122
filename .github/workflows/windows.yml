name: m122-windows
# Vérifications Windows du cours m122 : PowerShell 7 (pwsh) et Windows PowerShell 5.1.
# Ne contient aucun corrigé : seulement des sondes sur les comportements propres à Windows.
on:
  push:
    branches: [sondes-windows]
  workflow_dispatch:
jobs:
  sondes:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v4
      - name: Sondes (${{ matrix.shell }})
        shell: ${{ matrix.shell }}
        run: ./windows-sondes/windows-checks.ps1 -Sortie "resultats-${{ matrix.shell }}.txt"
      - name: Résumé
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "resultats-${{ matrix.shell }}.txt") {
            "### Résultats ${{ matrix.shell }}" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content "resultats-${{ matrix.shell }}.txt" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-${{ matrix.shell }}
          path: resultats-${{ matrix.shell }}.txt
