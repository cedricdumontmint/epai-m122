name: m122-windows
# Vérifications Windows du cours m122 : PowerShell 7 (pwsh) et Windows PowerShell 5.1.
# Ne contient aucun corrigé : seulement des sondes sur les comportements propres à Windows.
on:
  push:
    branches: [sondes-windows]
  workflow_dispatch:
jobs:
  pwsh7:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sondes PowerShell 7
        shell: pwsh
        run: ./windows-sondes/windows-checks.ps1 -Sortie resultats-pwsh7.txt
      - name: Résumé
        if: always()
        shell: pwsh
        run: |
          if (Test-Path resultats-pwsh7.txt) { Get-Content resultats-pwsh7.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-pwsh7
          path: resultats-pwsh7.txt
  powershell51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sondes Windows PowerShell 5.1
        shell: powershell
        run: ./windows-sondes/windows-checks.ps1 -Sortie resultats-ps51.txt
      - name: Résumé
        if: always()
        shell: pwsh
        run: |
          if (Test-Path resultats-ps51.txt) { Get-Content resultats-ps51.txt | Out-File $env:GITHUB_STEP_SUMMARY -Append }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-ps51
          path: resultats-ps51.txt
